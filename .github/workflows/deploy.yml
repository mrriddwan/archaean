name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: archaean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to DigitalOcean Container Registry
        run: |
          echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | \
            docker login registry.digitalocean.com \
            -u "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" \
            --password-stdin

      - name: Build and push Docker image
        id: build
        env:
          REGISTRY: registry.digitalocean.com
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
        run: |
          IMAGE="$REGISTRY/$REGISTRY_NAME/${{ env.IMAGE_NAME }}:latest"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_APP_VERSION="${{ vars.VITE_APP_VERSION }}" \
            --build-arg VITE_WEB_URL="${{ vars.VITE_WEB_URL }}" \
            --build-arg VITE_USER_NAME="${{ vars.VITE_USER_NAME }}" \
            --build-arg VITE_USER_TAGLINE="${{ vars.VITE_USER_TAGLINE }}" \
            --build-arg VITE_USER_LOCATION="${{ vars.VITE_USER_LOCATION }}" \
            --build-arg VITE_USER_EMAIL="${{ vars.VITE_USER_EMAIL }}" \
            --build-arg VITE_USER_PHONE="${{ vars.VITE_USER_PHONE }}" \
            --build-arg VITE_USER_LINKEDIN_URL="${{ vars.VITE_USER_LINKEDIN_URL }}" \
            --build-arg VITE_USER_GITHUB_URL="${{ vars.VITE_USER_GITHUB_URL }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Droplet
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          echo "${{ secrets.DROPLET_SSH_KEY }}" > key.pem
          chmod 600 key.pem

          ssh -o StrictHostKeyChecking=no -i key.pem \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} "
              set -e

              # Login to DOCR
              echo '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}' | \
                docker login registry.digitalocean.com \
                -u '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}' \
                --password-stdin

              # Pull latest image
              cd /opt/archaean
              docker compose pull frontend

              # Start/restart only frontend for now
              docker compose up -d frontend

              # Clean up old images to save disk space
              docker image prune -f
            "

          rm -f key.pem