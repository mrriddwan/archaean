# docker-compose.yml
services:
  frontend:
    image: registry.digitalocean.com/${REGISTRY_NAME}/archaean-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:80"   # Caddy on host proxies to this

  backend:
    image: registry.digitalocean.com/${REGISTRY_NAME}/archaean-backend:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/archaean
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: archaean
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: